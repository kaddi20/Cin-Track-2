<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin</title>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">
    <!--header-->
    <header class="flex justify-between items-center w-full bg-gray-800 px-4 py-5 sm:px-8">
        <h1 class="text-2xl text-white font-bold">CinéTrack</h1>
        <a href="index.html" class=" text-gray-200 bg-red-600 py-2 px-6 rounded-lg">Catalogue</a>
    </header>
    <main class="p-8">
        <h1 class="text-2xl font-bold mb-4">films et séries</h1>
        <p id="message" class="p-2"></p>
        <div >
            <table class="w-full text-left border border-gray-700 ">
                <thead>
                    <tr class="bg-gray-800">
                        <th class="p-3">Image</th>
                        <th class="p-3">Titre</th>
                        <th class="p-3">Type</th>
                        <th class="p-3">Année</th>
                        <th class="p-3">Action</th>
                    </tr>
                </thead>
                <tbody id="tabl-film"></tbody>
            </table>
        </div>
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 max-w-xl mx-auto mt-4 ">
            <h2 id="titre-form" class="text-xl font-bold mb-4 text-center">Ajouter un film</h2>
            <form id="titre-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input id="title" type="text" placeholder="titre" class="p-3 rounded-lg border border-gray-700 bg-gray-900">
                <select id="type" class="p-3 rounded-lg border border-gray-700 bg-gray-900">
                    <option value="">Choisir le type</option>
                    <option value="movie">Film</option>
                    <option valur="series">Série</option>
                </select>
                <input id="releaseYear" type="number" placeholder="année" class="p-3 rounded-lg bg-gray-900 border border-gray-700">
                <input id="image" type="url" placeholder="url de l'image" class="p-3 rounded-lg bg-gray-900 border border-gray-700 ">
                <input id="duration" type="number" placeholder="la durée" class="p-3 rounded-lg bg-gray-900 border border-gray-700">
                <input id="seasons" type="number" placeholder="nombre de saisons" class="p-3 rounded-lg bg-gray-900 border border-gray-700">
                <div class="flex justify-center mt-2">
                    <button id="btn-envoyer" type="submit" class="bg-blue-700 p-3 py-2 px-6 rounded-lg">Ajouter</button>
                </div>
                
                
            </form>
        </div>
    </main>
    <script type="module" src="js/admis.js"></script>
    
</body>
</html>
