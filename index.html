<!Doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <title>CinéTrack</title>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">
    <!--header-->
    <header class="w-full bg-gray-800 px-4 py-5 sm:px-8">
        <h1 class="text-2xl text-white font-bold">CinéTrack</h1>
    </header>
    <div class="flex flex-col md:flex-row min-h-screen">
        <main class="w-full">
            <section class="flex flex-col md:flex-row gap-3 px-3 py-3">
                <input type="text" id="search" placeholder="Rechercher un titre..."  class="w-full md:w-[35%] bg-gray-800 text-white rounded-2xl px-3 py-3">    
                <div class="flex flex-wrap items-center gap-3">
                    <button data-filtre="tous" class="filtre-btn bg-gray-800 text-white rounded-2xl px-3 py-3">Tous</button>
                    <button data-filtre="films" class="filtre-btn bg-gray-800 text-white rounded-2xl px-3 py-3">Films</button>
                    <button data-filtre="series" class="filtre-btn bg-gray-800 text-white rounded-2xl px-3 py-3">Séries</button>
                </div>
            </section>
                <div id="films-liste" class="grid grid-cols-2 sm:grid-cols-3  lg:grid-cols-4 gap-4"></div>
                <div id="pagination" class="flex justify-center gap-2 py-6"></div>
        </main>
        <aside id="favaorites-sidebar" class="w-full md:w-[30%] flex flex-col bg-slate-800 border-l border-gray-700 p-6 ">
            <h2>Favorites</h2>
            <div id="farorite-liste"></div>
        </aside>    
    </div>
<div id="modal" class="fixed hidden inset-0 z-50 flex items-center justify-center bg-black/80 "> 
    <div class="bg-gray-800 border border-gray-700 rounded-xl w-full max-w-lg p-6 relative shadow-2xl text-white">
        <button id="fermer"class="float-right text-white">X</button>
            <div id="details" class="flex gap-4 items-center"></div>
        </div>
    </div>
    </div>
            
    
     <script type="module" src="./js/main-cinetrack.js"></script>
    
</body>
</html>
